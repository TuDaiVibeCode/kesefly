plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.banknotifications'
version = '1.0.0'

android {
  namespace 'expo.modules.banknotifications'
  defaultConfig { versionCode 1; versionName '1.0.0' }
  testOptions { unitTests.includeAndroidResources = false }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
